<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cascade Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+SC:wght@500;700;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: full-screen game. The 3D table fills the window; a Balatro-style score column sits on the left, actions bottom-right, captions top-center. Single committed dark look (a card table under a lamp). */
:root {
  --bg: #0b1210;
  --panel: rgba(14, 22, 19, 0.9);
  --panel-solid: #121c18;
  --line: #2b3c34;
  --ink: #f1f5f1;
  --muted: #9aaca3;
  --chips: #3b8bff;
  --mult: #ff4a3d;
  --gold: #ffc23a;
  --ok: #3ddc97;
  --special: #b98cff;
  --font-display: "Bungee", "Noto Sans SC", Impact, sans-serif;
  --font-body: "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Noto Sans SC", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-body); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font-family: var(--font-body); font-weight: 900; cursor: pointer; border: 0; color: var(--ink); }
button:disabled { cursor: default; filter: grayscale(0.8) brightness(0.55); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* score column */
#side {
  position: fixed; left: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); bottom: 12px; width: 226px; z-index: 5;
  display: flex; flex-direction: column; gap: 9px; padding: 10px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
.blind { border-radius: 12px; padding: 10px; text-align: center; background: linear-gradient(160deg, #2f6fed, #16294d); }
.blind .name { font-family: var(--font-display); font-size: 20px; }
.blind .need { margin-top: 6px; background: rgba(0,0,0,0.35); border-radius: 8px; padding: 5px; display: grid; }
.lbl { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.blind .need .lbl { color: #cfe0ff; }
.blind .need b { font-family: var(--font-mono); font-size: 26px; color: #ff6b5f; }
.tile { border-radius: 12px; padding: 8px 10px; background: var(--panel-solid); display: grid; justify-items: center; gap: 2px; }
.tile b { font-family: var(--font-mono); font-size: 28px; font-variant-numeric: tabular-nums; }
.cm { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; width: 100%; }
.tok { padding: 4px 8px; border-radius: 9px; font-family: var(--font-mono); font-weight: 700; font-size: 24px; color: #fff; font-variant-numeric: tabular-nums; }
.tok.c { background: var(--chips); text-align: right; }
.tok.m { background: var(--mult); text-align: left; }
.x { color: var(--mult); font-weight: 900; font-size: 20px; }
.pair2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.pair2 .tile b { font-size: 24px; }
.blue { color: var(--chips); } .red { color: var(--mult); } .gold { color: var(--gold); }
.side-btns { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.sbtn { border-radius: 10px; padding: 9px 4px; background: #2a3a33; font-size: 14px; box-shadow: 0 4px 0 rgba(0,0,0,0.45); }
.sbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.45); }

/* actions */
#actions { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; gap: 10px; align-items: end; }
.big { border-radius: 14px; padding: 16px 26px; font-size: 22px; box-shadow: 0 6px 0 rgba(0,0,0,0.5); transition: transform 0.08s; }
.big:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.5); }
.big.tip { background: var(--ok); color: #04150d; font-size: 26px; padding: 18px 34px; }
.big.clear { background: #3a4a43; font-size: 17px; padding: 12px 18px; }
#tipBtn:not(:disabled) { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: translateY(-3px); box-shadow: 0 9px 0 rgba(0,0,0,0.5), 0 0 26px rgba(61,220,151,0.5); } }

/* captions & toasts */
#caption {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(50% + 125px); transform: translateX(-50%); z-index: 6; width: min(640px, calc(100vw - 290px));
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 12px; padding: 10px 14px; font-size: 16px; line-height: 1.45; pointer-events: none;
}
#caption b { color: var(--gold); }
#caption .c { color: var(--chips); font-weight: 900; } #caption .m { color: var(--mult); font-weight: 900; }
#skip { position: fixed; z-index: 7; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; border-radius: 10px; padding: 9px 14px; background: #3a4a43; font-size: 14px; }

/* 3D-anchored labels */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.anchor { position: absolute; left: 0; top: 0; will-change: transform; }
.badge { display: grid; gap: 2px; justify-items: center; }
.badge span { font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 5px; white-space: nowrap; background: rgba(8,14,12,0.85); }
.badge .ok { color: var(--ok); border: 1px solid var(--ok); }
.badge .wild { color: var(--special); border: 1px solid var(--special); }
.badge .stop { color: #fff; background: var(--mult); }
.badge .thru { color: var(--muted); border: 1px solid var(--line); }
.tablelbl { font-size: 12px; letter-spacing: 0.12em; color: rgba(220, 240, 230, 0.55); font-weight: 700; white-space: nowrap; }
.pop {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-family: var(--font-mono); font-weight: 700; font-size: 17px;
  padding: 3px 10px; border-radius: 9px; color: #fff; animation: rise 1.25s cubic-bezier(.2,.9,.3,1) forwards; box-shadow: 0 4px 0 rgba(0,0,0,0.4);
}
.pop.c { background: var(--chips); } .pop.m { background: var(--mult); } .pop.s { background: var(--special); color: #170a2c; }
.pop.x { background: var(--mult); font-size: 26px; outline: 3px solid #fff; }
.pop.bad { background: #2a0d0b; color: #ffb3ad; border: 2px solid var(--mult); font-size: 18px; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -20%) scale(0.4); } 15% { opacity: 1; transform: translate(-50%, -80%) scale(1.15); } 30% { transform: translate(-50%, -95%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -190%); } }
.total {
  position: fixed; left: calc(50% + 125px); top: 40%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none; text-align: center;
  font-family: var(--font-mono); font-weight: 700; font-size: clamp(40px, 8vw, 84px); color: #fff; text-shadow: 0 0 24px var(--gold), 0 6px 0 rgba(0,0,0,0.5);
  animation: slam 1.5s ease forwards;
}
@keyframes slam { 0% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; } 18% { transform: translate(-50%, -50%) scale(0.92); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { transform: translate(-80vw, -50%) scale(0.3); opacity: 0; } }
.bump { animation: bump 0.25s ease-out; }
@keyframes bump { 40% { transform: scale(1.22); } }

/* screens */
.screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(8,14,12,0.55), rgba(8,14,12,0.92)); }
.card-ui { width: min(560px, 100%); max-height: calc(100% - 20px); overflow: auto; display: grid; gap: 16px; justify-items: center; text-align: center; padding: 26px 22px; border-radius: 20px; background: var(--panel-solid); border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,0.6); animation: pop-in 0.35s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop-in { from { transform: translateY(40px) scale(0.92); opacity: 0; } }
.logo { font-family: var(--font-display); font-size: clamp(54px, 12vw, 96px); line-height: 0.9; letter-spacing: 0.02em; }
.logo span { color: var(--gold); }
.logo-sub { font-family: var(--font-display); font-size: 22px; color: var(--muted); margin-top: -6px; }
.card-ui p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; max-width: 42ch; }
.menu { display: grid; gap: 10px; width: min(320px, 100%); }
.menu .big { width: 100%; }
.big.gold { background: var(--gold); color: #1d1503; }
.big.dark { background: #33443d; font-size: 18px; }
.langs { display: flex; gap: 6px; }
.langs button { border-radius: 9px; padding: 7px 14px; background: #2a3a33; font-size: 14px; }
.langs button[aria-pressed="true"] { background: var(--gold); color: #1d1503; }
.result h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 7vw, 54px); }
.rules { display: grid; gap: 10px; text-align: left; width: 100%; font-size: 15px; }
.rules h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--gold); text-align: center; }
.rules .r { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: baseline; }
.rules .r span:first-child { font-family: var(--font-mono); font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 5px; text-align: center; }
.rules .ok { color: var(--ok); border: 1px solid var(--ok); } .rules .stop { background: var(--mult); color: #fff; } .rules .wild { color: var(--special); border: 1px solid var(--special); }
.rules .c { color: var(--chips); font-weight: 900; } .rules .m { color: var(--mult); font-weight: 900; }

/* phones */
@media (max-width: 760px), (max-height: 520px) {
  #side { left: 6px; right: 6px; top: calc(6px + env(safe-area-inset-top, 0px)); bottom: auto; width: auto; flex-direction: row; flex-wrap: wrap; gap: 5px; padding: 6px; }
  .blind { flex: 1 1 120px; padding: 5px 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .blind .name { font-size: 14px; }
  .blind .need { margin: 0; padding: 2px 8px; }
  .blind .need .lbl { display: none; }
  .blind .need b { font-size: 18px; }
  .tile { padding: 3px 8px; flex: 1 1 70px; }
  .tile b { font-size: 18px; }
  #scoreTile .lbl, #tipTile .lbl { display: none; }
  .tok { font-size: 16px; padding: 2px 6px; }
  .pair2 { flex: 1 1 120px; gap: 5px; }
  .pair2 .tile b { font-size: 16px; }
  .side-btns { margin: 0; flex: 0 0 auto; grid-template-columns: repeat(3, 38px); }
  .sbtn { padding: 6px 2px; font-size: 13px; }
  .hide-sm { display: none; }
  #caption { left: 50%; top: auto; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); width: calc(100vw - 20px); font-size: 14px; padding: 8px 10px; }
  #actions { left: 50%; right: auto; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .big.tip { font-size: 20px; padding: 13px 26px; }
  .big.clear { font-size: 14px; padding: 10px 12px; }
  .total { left: 50%; }
  #skip { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .pop, .total, .card-ui { animation-duration: 0.01s; } #tipBtn { animation: none !important; } }
</style>
</head>
<body>


<canvas id="gl" aria-label="Card table"></canvas>
<div id="labels"></div>

<aside id="side" aria-label="Score">
  <div class="blind"><div class="name" data-t="blind"></div><div class="need"><span class="lbl" data-t="atLeast"></span><b id="hTarget">4,000</b></div></div>
  <div class="tile" id="scoreTile"><span class="lbl" data-t="roundScore"></span><b id="hScore" class="gold">0</b></div>
  <div class="tile" id="tipTile"><span class="lbl" data-t="thisTip"></span><div class="cm"><span class="tok c" id="hChips">0</span><span class="x">×</span><span class="tok m" id="hMult">1</span></div></div>
  <div class="pair2">
    <div class="tile"><span class="lbl" data-t="tips"></span><b id="hTips" class="blue">3</b></div>
    <div class="tile"><span class="lbl" data-t="deck"></span><b id="hDeck">44</b></div>
  </div>
  <div class="side-btns">
    <button class="sbtn" id="rulesBtn" data-t="rulesShort"></button>
    <button class="sbtn" id="langBtn">中</button>
    <button class="sbtn" id="soundBtn" aria-label="Sound">♪</button>
  </div>
</aside>

<div id="caption" hidden></div>
<button id="skip" hidden data-t="skip"></button>

<div id="actions" hidden>
  <button class="big clear" id="clearBtn" data-t="clear"></button>
  <button class="big tip" id="tipBtn" data-t="tip"></button>
</div>

<div class="screen" id="title">
  <div class="card-ui">
    <div><div class="logo">CAS<span>CADE</span></div><div class="logo-sub" data-t="zhName"></div></div>
    <p data-t="pitch"></p>
    <div class="menu">
      <button class="big gold" id="playBtn" data-t="play"></button>
      <button class="big dark" id="howBtn" data-t="how"></button>
    </div>
    <div class="langs" role="group" aria-label="Language"><button id="lEn" aria-pressed="true">English</button><button id="lZh" aria-pressed="false">简体中文</button></div>
  </div>
</div>

<div class="screen" id="result" hidden>
  <div class="card-ui result"><h2 id="rTitle"></h2><p id="rText"></p><div class="menu"><button class="big gold" id="againBtn" data-t="again"></button><button class="big dark" id="menuBtn" data-t="menu"></button></div></div>
</div>

<div class="screen" id="rulesScr" hidden>
  <div class="card-ui"><div class="rules" id="rulesBody"></div><div class="menu"><button class="big gold" id="rulesClose" data-t="back"></button></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  const fmtM = (m) => (m % 1 ? m.toFixed(1) : fmt(m));

  /* ───────────── localisation ───────────── */
  const I18N = {
    en: {
      zhName: 'chain-reaction poker', pitch: 'Stand your cards in a line and tip the first one. A card only knocks over the next if they share something. Every card that falls scores chips × mult.',
      play: 'Play', how: 'How to play', again: 'Play again', menu: 'Main menu', back: 'Back to the table', skip: 'Skip ▸',
      blind: 'Small Blind', atLeast: 'Score at least', roundScore: 'Round score', thisTip: 'This tip', tips: 'Tips', deck: 'Deck', rulesShort: 'Rules',
      tip: 'TIP IT!', clear: 'Clear', handLbl: 'YOUR HAND · click to stand a card', spLbl: 'SPECIAL PIECES · once per tip',
      pair: 'PAIR +4', step: 'STEP +2', suit: 'SUIT +10', run: 'RUN +3', stop: '✕ STOP', wild: 'WILD', thru: '→',
      popMult: (n) => `+${n} mult`, popX: '×2 MULT', popNo: '✕ no link', popWild: '⇄ wild', popLoop: (c, m) => `↺ +${c} / +${m}`,
      bridge: ['BRIDGE', 'Next card always links'], loop: ['LOOP', 'Replays last 2 cards'], ramp: ['RAMP', '×2 mult when it falls'],
      hint: 'Click cards in your hand to stand them in a line. Green badges are links. Then press <b>TIP IT!</b>',
      hintStop: 'The red <b>✕ STOP</b> badge means the chain will stop there. Cards after it won\'t score.',
      tipping: '<b>Tipping…</b>',
      broke: (a, b) => `<b>Chain stopped.</b> ${a} and ${b} share nothing, so the rest never falls.`,
      summary: (c, m, t, full) => `<span class="c">${c} chips</span> × <span class="m">${m} mult</span> = <b>${t}</b>${full ? ' · full chain!' : ''}`,
      next: (s, tg, n) => `Round score <b>${s}</b> / ${tg}. ${n} tip${n === 1 ? '' : 's'} left. New cards drawn.`,
      win: 'Blind cleared!', winText: (s, tg) => `You scored ${s} against ${tg}. In the full game, the shop opens now.`,
      lose: (n) => `Short by ${n}`, loseText: (s, tg) => `You scored ${s} of ${tg}. One more link would have done it.`,
      tut: [
        'You hold <b>8 cards</b>. Each tip, you stand some of them in a line on the table.',
        '<b>5♥</b> goes first. It starts the chain.',
        '<b>6♥</b> links to 5♥ two ways: one rank apart (<b>STEP</b>) and same suit (<b>SUIT</b>).',
        '<b>6♣</b> links to 6♥ by rank: a <b>PAIR</b>.',
        '<b>K♠</b> shares nothing with 6♣. See the red <b>✕ STOP</b>? The chain would stop here.',
        'So take it back. Choosing the order is the whole puzzle.',
        '<b>7♣</b>: step and same suit. Three steps in a row also add a <b>RUN</b> bonus.',
        'A <b>LOOP</b> replays the last two cards\' scores when it falls.',
        '<b>8♣</b> still has to link to 7♣ across the Loop.',
        '<b>RAMP</b> doubles the mult when it falls, so put it last: add first, multiply last.',
        'Ready. <b>Tip it!</b>',
      ],
      tutCard: (p, base, tags) => `<b>${p}</b> falls: <span class="c">+${base} chips</span>${tags ? ' · links: <b>' + tags + '</b>' : ' · first card'}`,
      tutLoop: (c, m) => `<b>LOOP</b> replays two cards: <span class="c">+${c} chips</span>, <span class="m">+${m} mult</span>`,
      tutRamp: (m) => `<b>RAMP</b>: mult doubles to <span class="m">${m}</span>, multiplying everything before it.`,
      tutEnd: (s) => `One tip scored <b>${s}</b>. A real round gives you <b>3 tips</b> to reach 4,000 with random cards. Your turn!`,
      rules: `<h3>Rules</h3>
        <div class="r"><span class="ok">PAIR</span><span>same rank: <span class="m">+4 mult</span></span></div>
        <div class="r"><span class="ok">STEP</span><span>ranks one apart (6→7): <span class="m">+2 mult</span>. Three in a row add <span class="m">+3</span> more each (RUN).</span></div>
        <div class="r"><span class="ok">SUIT</span><span>same suit: <span class="c">+10 chips</span></span></div>
        <div class="r"><span class="stop">✕ STOP</span><span>nothing shared: the chain stops; later cards score nothing.</span></div>
        <div class="r"><span class="wild">BRIDGE</span><span>the next card always links.</span></div>
        <div class="r"><span class="wild">LOOP</span><span>replays the last two cards' scores.</span></div>
        <div class="r"><span class="wild">RAMP</span><span><span class="m">×2 mult</span> when it falls. Put it late.</span></div>
        <p>Every falling card also adds its value in <span class="c">chips</span> (2–10, J/Q/K 10, A 11). Reach the target in 3 tips.</p>`,
    },
    zh: {
      zhName: '连环倒', pitch: '把手牌立成一排，推倒第一张。相邻两张牌必须有共同点，前一张才能撞倒后一张。每倒下一张牌，都会按 筹码 × 倍率 计分。',
      play: '开始游戏', how: '玩法演示', again: '再来一局', menu: '主菜单', back: '回到牌桌', skip: '跳过 ▸',
      blind: '小盲注', atLeast: '至少得分', roundScore: '本轮得分', thisTip: '本次推倒', tips: '次数', deck: '牌库', rulesShort: '规则',
      tip: '推倒！', clear: '清空', handLbl: '手牌 · 点击把牌立起来', spLbl: '特殊牌 · 每次推倒限用一次',
      pair: '对子 +4', step: '顺连 +2', suit: '同花 +10', run: '连顺 +3', stop: '✕ 断链', wild: '万能', thru: '→',
      popMult: (n) => `+${n} 倍率`, popX: '倍率 ×2', popNo: '✕ 断链', popWild: '⇄ 万能', popLoop: (c, m) => `↺ +${c} / +${m}`,
      bridge: ['桥接', '下一张必定相连'], loop: ['回放', '重算前两张牌'], ramp: ['翻倍', '倒下时倍率 ×2'],
      hint: '点击手牌，把牌立成一排。绿色标签表示相连。然后按 <b>推倒！</b>',
      hintStop: '红色 <b>✕ 断链</b> 表示连锁会在这里停下，后面的牌不会得分。',
      tipping: '<b>推倒中……</b>',
      broke: (a, b) => `<b>连锁中断。</b>${a} 和 ${b} 没有任何共同点，后面的牌都没有倒下。`,
      summary: (c, m, t, full) => `<span class="c">${c} 筹码</span> × <span class="m">${m} 倍率</span> = <b>${t}</b>${full ? ' · 完整连锁！' : ''}`,
      next: (s, tg, n) => `本轮得分 <b>${s}</b> / ${tg}，还剩 ${n} 次推倒。已补充新牌。`,
      win: '过关！', winText: (s, tg) => `你得了 ${s} 分，目标是 ${tg} 分。完整版游戏中，接下来会打开商店。`,
      lose: (n) => `还差 ${n} 分`, loseText: (s, tg) => `你得了 ${s} / ${tg} 分。再多连一张就够了。`,

      if (inChain(specialData[id])) return;
      const up = pc === hovered && canEdit() ? 1 : 0;
      pc.tpos.set((j - 1) * 1.05, 0.02 + up * 0.15, spZ());
      pc.trot = -1.25 + up * 0.25; pc.trotZ = 0; pc.tscale = 0.88;
    });
    S.chain.forEach((p, i) => {
      const pc = getPiece(p);
      const sp = slotPos(i);
      pc.tpos.set(sp.x, 0, sp.z);
      if (!pc.fallen && !pc.fall) { pc.trot = pc === hovered && canEdit() ? -0.12 : 0; }
      pc.trotZ = 0; pc.tscale = 1;
    });
  }
  const specialData = { bridge: { sp: 'bridge', id: 'bridge' }, loop: { sp: 'loop', id: 'loop' }, ramp: { sp: 'ramp', id: 'ramp' } };
  const canEdit = () => S.mode === 'play' && !S.busy && !S.tutorial;

  /* link badges between standing pieces */
  function refreshBadges() {
    badgeAnchors.forEach(unanchor); badgeAnchors = [];
    if (S.busy && !S.tutorial) return;
    if (S.busy && S.tutorial && S.tipping) return;
    const pl = previewLinks(S.chain);
    pl.forEach((lk, i) => {
      if (i === 0) return;
      let html;
      const t = L();
      if (lk.kind === 'ok') html = lk.l.map((k) => `<span class="ok">${t[k]}</span>`).join('');
      else if (lk.kind === 'wild') html = `<span class="wild">${t.wild}</span>`;
      else if (lk.kind === 'stop') html = `<span class="stop">${t.stop}</span>`;
      else html = `<span class="thru">${t.thru}</span>`;
      badgeAnchors.push(anchor('badge', html, () => {
        const a = slotPos(i - 1), b = slotPos(i);
        const x = a.z === b.z ? (a.x + b.x) / 2 : b.x - GAP / 2 - 0.05;
        return new THREE.Vector3(x, CH + 0.28, b.z);
      }));
    });
  }

  /* ───────────── HUD ───────────── */
  function setHud(chips = 0, mult = 1) {
    $('hTarget').textContent = fmt(TARGET);
    $('hScore').textContent = fmt(S.score);
    $('hTips').textContent = S.tips;
    $('hDeck').textContent = S.deck.length;
    $('hChips').textContent = fmt(chips);
    $('hMult').textContent = fmtM(mult);
  }
  function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  function caption(html) { const c = $('caption'); if (html == null) { c.hidden = true; return; } c.innerHTML = html; c.hidden = false; }
  function refreshButtons() {
    const real = S.chain.some((p) => !p.sp);
    $('actions').hidden = S.mode !== 'play';
    $('tipBtn').disabled = !canEdit() || !real || S.tips <= 0;
    $('clearBtn').disabled = !canEdit() || !S.chain.length;
    if (S.mode === 'play' && !S.busy && !S.tutorial) {
      const stop = previewLinks(S.chain).some((x) => x.kind === 'stop');
      caption(stop ? L().hintStop : L().hint);
    }
  }
  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = L()[el.dataset.t]; });
    $('rulesBody').innerHTML = L().rules;
    $('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
    $('lEn').setAttribute('aria-pressed', String(lang === 'en'));
    $('lZh').setAttribute('aria-pressed', String(lang === 'zh'));
    handLbl.el.textContent = L().handLbl; spLbl.el.textContent = L().spLbl;
    SPECIAL_IDS.forEach((id) => pieces.get(id) && pieces.get(id).retexture());
    refreshBadges(); refreshButtons();
  }
  async function setLang(l) {
    lang = l;
    try { localStorage.setItem('cascade-lang', l); } catch (e) { /* optional */ }
    if (l === 'zh' && document.fonts) { try { await Promise.race([document.fonts.load('900 52px "Noto Sans SC"', '桥接回放翻倍'), wait(1500)]); } catch (e) { /* fallback font */ } }
    applyLang();
  }

  /* ───────────── actions ───────────── */
  function place(p) {
    if (S.chain.length >= SLOTS || inChain(p)) return;
    S.chain.push(p);
    const pc = getPiece(p); pc.fallen = false; pc.trot = 0;
    tone(520 + S.chain.length * 45, 0.07, 'square', 0.06);
    refreshBadges(); refreshButtons();
  }
  function unplace(p) {
    const i = S.chain.indexOf(p);
    if (i < 0) return;
    S.chain.splice(i, 1);
    tone(300, 0.07, 'square', 0.05);
    refreshBadges(); refreshButtons();
  }
  function clearChain() { [...S.chain].forEach(unplace); }

  async function tip(tut) {
    S.busy = true; S.tipping = true; refreshBadges(); refreshButtons();
    const res = simulate(S.chain);
    setHud(0, 1);
    if (!tut) caption(L().tipping);
    const t = L();
    let n = 0;
    const top = (i) => { const sp = slotPos(i); return new THREE.Vector3(sp.x, CH + 0.05, sp.z); };
    spark.position.copy(top(0)).add(new THREE.Vector3(-0.9, 0.3, 0));
    for (const e of res.ev) {
      const pc = getPiece(S.chain[e.i]);
      await hopTo(spark.position, top(e.i), (n === 0 ? 260 : 170) / 1000);
      if (e.kind === 'break') {
        pc.shakeT = 1.2; pc.redGlow = true;
        pop(top(e.i).add(new THREE.Vector3(0, 0.25, 0)), t.popNo, 'bad');
        tone(140, 0.35, 'sawtooth', 0.14, 0.5);
        shake = Math.max(shake, 0.12);
        caption(t.broke(cardName(e.prev), cardName(S.chain[e.i])));
        await wait(1400);
        break;
      }
      pc.fall = { t: 0, dur: 0.34 }; pc.fallen = true; pc.flash = 1;
      n++;
      thud(n);
      shake = Math.max(shake, 0.05 + n * 0.012);
      const sp = slotPos(e.i);
      const lie = new THREE.Vector3(sp.x, 0.35, sp.z - 0.55);
      if (e.kind === 'card') {
        setTimeout(() => {
          pop(lie, '+' + e.c, 'c');
          burst(lie, '#3b8bff', 18, 2.2);
          if (e.m) setTimeout(() => { pop(lie.clone().add(new THREE.Vector3(0, 0.45, 0)), t.popMult(e.m), 'm'); burst(lie, '#ff4a3d', 14, 2); }, 140);
        }, 300);
        if (tut) caption(t.tutCard(cardName(S.chain[e.i]), e.base, e.tags.map((k) => t[k].split(' ')[0]).join(' + ')));
      } else if (e.kind === 'ramp') {
        setTimeout(() => { pop(lie, t.popX, 'x'); burst(lie, '#ff4a3d', 60, 4); shake = 0.3; tone(160, 0.4, 'sawtooth', 0.18, 3); }, 300);
        if (tut) caption(t.tutRamp(fmtM(e.mult)));
      } else if (e.kind === 'loop') {
        setTimeout(() => { pop(lie, t.popLoop(e.dc, e.dm), 's'); burst(lie, '#b98cff', 30, 3); tone(660, 0.18); }, 300);
        if (tut) caption(t.tutLoop(e.dc, e.dm));
      } else {
        setTimeout(() => { pop(lie, t.popWild, 's'); burst(lie, '#b98cff', 20, 2.5); }, 300);
      }
      await wait(320);
      setHud(e.chips, e.mult); bump($('hChips')); bump($('hMult'));
      await wait(tut ? 1300 : 330);
    }
    spark.visible = false;
    await wait(300);
    // the payoff
    const total = res.score;
    const big = document.createElement('div');
    big.className = 'total'; big.textContent = fmt(total);
    document.body.appendChild(big);
    setTimeout(() => big.remove(), 1600);
    tone(392, 0.25); tone(523, 0.25); tone(659, 0.35);
    shake = Math.max(shake, Math.min(0.5, 0.1 + total / 8000));
    burst(new THREE.Vector3(0, 1.2, LANE_Z), '#ffc23a', 90, 5);
    caption(t.summary(fmt(res.chips), fmtM(res.mult), fmt(total), res.broke < 0));
    await wait(1100);
    S.score += total; S.tips -= 1;
    setHud(res.chips, res.mult); bump($('hScore'));
    await wait(900);
    S.tipping = false;
    return res;
  }

  function sweep() {
    // used cards fly off the table, specials return home
    for (const p of S.chain) {
      const pc = getPiece(p);
      pc.fallen = false; pc.redGlow = false;
      if (p.sp) { pc.trot = -1.25; continue; }
      pc.tpos.set(9, 0.3, LANE_Z - 1.5); pc.trot = -Math.PI / 2;
      const id = p.id;
      setTimeout(() => { const q = pieces.get(id); if (q && !S.hand.includes(q.p)) { q.dispose(); pieces.delete(id); } }, 900);
    }
    const used = new Set(S.chain.filter((p) => !p.sp));
    S.hand = S.hand.filter((c) => !used.has(c));
    S.chain = [];
  }

  async function onTip() {
    if (!canEdit()) return;
    await tip(false);
    sweep();
    await wait(350);
    draw();
    S.busy = false;
    setHud();
    if (S.score >= TARGET) return endRound(true);
    if (S.tips <= 0) return endRound(false);
    refreshBadges(); refreshButtons();
    caption(L().next(fmt(S.score), fmt(TARGET), S.tips));
    await wait(2600);
    if (S.mode === 'play' && !S.busy && !S.chain.length) refreshButtons();
  }

  function endRound(win) {
    S.mode = 'result'; refreshButtons(); caption(null);
    const t = L();
    $('rTitle').textContent = win ? t.win : t.lose(fmt(TARGET - S.score));
    $('rTitle').style.color = win ? 'var(--gold)' : 'var(--mult)';
    $('rText').textContent = win ? t.winText(fmt(S.score), fmt(TARGET)) : t.loseText(fmt(S.score), fmt(TARGET));
    if (win) { for (let i = 0; i < 5; i++) setTimeout(() => burst(new THREE.Vector3((Math.random() - 0.5) * 6, 1, LANE_Z), ['#ffc23a', '#3b8bff', '#ff4a3d', '#3ddc97', '#b98cff'][i], 70, 6), i * 180); tone(523, 0.3); tone(659, 0.3); tone(784, 0.4); }
    else tone(220, 0.5, 'sawtooth', 0.12, 0.5);
    setTimeout(() => { $('result').hidden = false; }, win ? 700 : 300);
  }

  function resetTable() {
    for (const [id, pc] of pieces) { if (!SPECIAL_IDS.includes(id)) { pc.dispose(); pieces.delete(id); } }
    SPECIAL_IDS.forEach((id) => { const pc = getPiece(specialData[id]); pc.fallen = false; pc.redGlow = false; });
    S.deck = newDeck(); S.hand = []; S.chain = []; S.score = 0; S.tips = TIPS; S.busy = false; S.tutorial = false; S.tipping = false;
  }

  function startGame() {
    $('title').hidden = true; $('result').hidden = true; $('skip').hidden = true;
    resetTable();
    S.mode = 'play';
    draw(); setHud(); refreshBadges(); refreshButtons();
  }

  /* guided example */
  let tutToken = 0;
  async function startTutorial() {
    const my = ++tutToken;
    $('title').hidden = true; $('result').hidden = true;
    resetTable();
    S.mode = 'play'; S.tutorial = true; S.busy = true;
    const C = (r, s) => ({ r, s, id: r + s });
    S.hand = [C(2, 'd'), C(5, 'h'), C(6, 'h'), C(6, 'c'), C(7, 'c'), C(8, 'c'), C(9, 'd'), C(13, 's')];
    const ids = new Set(S.hand.map((c) => c.id));
    S.deck = S.deck.filter((c) => !ids.has(c.id));
    S.hand.forEach((c, i) => { const pc = getPiece(c); pc.pos.set(7, 0.4, HAND_Z - 0.6); });
    setHud(); refreshButtons();
    $('skip').hidden = false;
    const card = (r, s) => S.hand.find((c) => c.r === r && c.s === s);
    const T = () => L().tut;
    const steps = [
      [0, null, 2600], [1, () => place(card(5, 'h'))], [2, () => place(card(6, 'h')), 3300], [3, () => place(card(6, 'c'))],
      [4, () => place(card(13, 's')), 3600], [5, () => unplace(card(13, 's')), 2500], [6, () => place(card(7, 'c')), 3300],
      [7, () => place(specialData.loop), 3000], [8, () => place(card(8, 'c')), 3000], [9, () => place(specialData.ramp), 3600], [10, null, 1500],
    ];
    for (const [k, fn, ms] of steps) {
      if (my !== tutToken) return;
      caption(T()[k]);
      if (fn) fn();
      await wait((ms || 2600) * (REDUCE ? 0.6 : 1));
    }
    if (my !== tutToken) return;
    const res = await tip(true);
    if (my !== tutToken) return;
    caption(L().tutEnd(fmt(res.score)));
    await wait(3600);
    if (my !== tutToken) return;
    startGame();
  }

  /* ───────────── input ───────────── */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(ev) {
    ndc.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const meshes = [...pieces.values()].map((p) => p.mesh);
    const hit = ray.intersectObjects(meshes, false)[0];
    return hit ? hit.object.userData.piece : null;
  }
  canvas.addEventListener('pointermove', (ev) => {
    const pc = canEdit() ? pick(ev) : null;
    if (pc !== hovered) { hovered = pc; if (pc) tone(900, 0.03, 'triangle', 0.04); }
    canvas.style.cursor = pc ? 'pointer' : 'default';
  });
  canvas.addEventListener('pointerdown', (ev) => {
    if (!canEdit()) return;
    const pc = pick(ev);
    if (!pc) return;
    if (inChain(pc.p)) unplace(pc.p);
    else if (S.chain.length < SLOTS) place(pc.p);
  });
  $('tipBtn').onclick = onTip;
  $('clearBtn').onclick = () => canEdit() && clearChain();
  $('playBtn').onclick = startGame;
  $('howBtn').onclick = startTutorial;
  $('againBtn').onclick = startGame;
  $('menuBtn').onclick = () => { $('result').hidden = true; S.mode = 'title'; resetTable(); demoChain(); $('title').hidden = false; refreshButtons(); caption(null); };
  $('skip').onclick = () => { tutToken++; startGame(); };
  $('rulesBtn').onclick = () => { $('rulesScr').hidden = false; };
  $('rulesClose').onclick = () => { $('rulesScr').hidden = true; };
  $('langBtn').onclick = () => setLang(lang === 'zh' ? 'en' : 'zh');
  $('lEn').onclick = () => setLang('en');
  $('lZh').onclick = () => setLang('zh');
  $('soundBtn').onclick = () => { muted = !muted; $('soundBtn').textContent = muted ? '✕' : '♪'; };
  window.addEventListener('keydown', (e) => { if (e.key === 'Enter' && canEdit()) onTip(); if (e.key === 'Escape') $('rulesScr').hidden = true; });

  /* ───────────── camera fit & loop ───────────── */
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    const narrow = w <= 760 || h <= 520;
    const sideW = narrow ? 0 : 250;
    const topH = narrow ? $('side').offsetHeight + 8 : 0;
    const botH = narrow ? 70 : 0;
    const cw = w - sideW, ch = h - topH - botH;
    camera.aspect = w / h;
    camera.setViewOffset(w, h, -sideW / 2, -(topH - botH) / 2, w, h);
    const vh = THREE.MathUtils.degToRad(camera.fov);
    // content box on screen: ~9.2 units wide, ~7.4 units tall (perspective-compressed table depth)
    const wasPortrait = portrait;
    portrait = cw / ch < 0.95;
    if (portrait !== wasPortrait || !laneMarks.length) { buildLanes(); refreshBadges(); }
    // content box on screen (perspective-compressed): landscape ~9.2 x 7.4 units, portrait ~4.7 x 9.6
    const boxW = portrait ? 4.7 : 9.2, boxH = portrait ? 10.2 : 7.4;
    handLbl.el.hidden = portrait;
    const needH = Math.max(boxH, boxW / (cw / ch));
    camDist = (needH * h / ch) / (2 * Math.tan(vh / 2)) * 0.95;
    LOOK.z = portrait ? 0.35 : -0.1;
    scene.fog.near = camDist + 2; scene.fog.far = camDist + 14;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    layout();
    for (const pc of pieces.values()) pc.update(dt, now);
    if (hop) {
      hop.t += dt;
      const p = Math.min(1, hop.t / hop.dur);
      spark.position.lerpVectors(hop.from, hop.to, p);
      spark.position.y += Math.sin(p * Math.PI) * 0.35;
      if (p >= 1) { const r = hop.res; hop = null; r(); }
    }
    stepParticles(dt);
    shake = Math.max(0, shake - dt * 0.8);
    const sh = REDUCE ? 0 : shake * shake;
    camera.position.copy(LOOK).addScaledVector(CAM_DIR, camDist);
    camera.position.x += (Math.random() - 0.5) * sh; camera.position.y += (Math.random() - 0.5) * sh;
    camera.lookAt(LOOK);
    for (const a of anchors) {
      const s = toScreen(a.getPos());
      a.el.style.transform = `translate(${s.x}px, ${s.y}px) translate(-50%, -50%)`;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  /* title screen: a sample chain stands on the table behind the menu */
  function demoChain() {
    const C = (r, s) => ({ r, s, id: r + s });
    S.hand = [C(4, 'd'), C(5, 'd'), C(5, 's'), C(6, 's'), C(7, 's')];
    S.hand.forEach((c) => getPiece(c));
    S.hand.forEach((c) => S.chain.push(c));
    S.chain.splice(3, 0, specialData.loop);
    S.chain.push(specialData.ramp);
    S.mode = 'title';
    refreshBadges();
  }

  function start() {
    resize();
    applyLang();
    demoChain();
    setHud();
    requestAnimationFrame(frame);
  }
  const ready = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, wait(1500)]) : Promise.resolve();
  ready.then(start);
})();
</script>

</body>
